packages:
  - "."

allowBuilds:
  esbuild: true

# Supply-chain rule: pnpm refuses (at resolution and when checking a lockfile) any package version
# published less than 14 days ago. The unit is minutes (14 * 24 * 60). Checked against pnpm 11.11.0:
# a deliberately huge value makes `pnpm install --frozen-lockfile` fail on the current lockfile, so
# the key is enforced and not silently ignored. app/ has its own workspace file with the same rule.
minimumReleaseAge: 20160
